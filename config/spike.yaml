# Spike 0 configuration.
#
# Rules from CLAUDE.md that this file enforces:
#   - No model names, endpoints or prices in code. They live here.
#   - Every price carries a verified_on date. The harness REFUSES to use a
#     price without one, or one older than price_max_age_days.
#   - Model weights carry a licence and the date it was read.
#
# Nothing below has been verified. Every `null` is a deliberate blocker:
# fill it in only after reading the provider's current official docs, and
# record what you found in docs/decisions/.

run_root: spike/runs
price_max_age_days: 90

# --- Identity scorer -------------------------------------------------------
# DECIDED: dlib, 2026-09-23. See docs/decisions/0002-face-embedding-model-licence.md
# and docs/reports/calibration-2026-09-23.md.
#
# DINOv2 was chosen on 2026-09-22 and measured MARGINAL the next day against a
# realistic control (overlap 0.297, only 66% of the persona's own images
# clearing the threshold). dlib measured EXCELLENT on identical data: overlap
# 0.000, 100%. A general visual embedder was distracted by the styling the two
# sets share; a face recogniser is invariant to it and is forced onto facial
# geometry.
#
# Still open: whether dlib's invariance makes it too forgiving of drift in HER,
# which is the opposite failure and cannot be measured until Phase 1 video.
# DINOv2 stays configured as a possible secondary signal for exactly that.
#
# Changing this later invalidates every stored vector and the calibrated
# threshold with them (BUILD_ORDER amendment A3), so it is not a setting to
# flip casually. The code enforces that: scoring with a calibration from a
# different model raises rather than comparing incomparable numbers.
embedder:
  backend: dlib            # SWITCHED 2026-09-23 after the bake-off, see ADR 0002
  model: null              # exact weights identifier
  version: null            # weights version/revision, pinned
  dim: null                # embedding dimension
  licence: null            # verbatim licence identifier
  licence_verified_on: null  # YYYY-MM-DD, date the licence TEXT was read
  frame_sample_fps: 2.0
  # Similarity below which a frame is treated as a different person for
  # reporting. Written by `cli.py calibrate`; do not hand-edit.
  threshold: null
  threshold_calibrated_on: null

  # Candidate backends for the ADR 0002 bake-off. Each declares its OWN
  # dimension, licence and model paths -- they share nothing but the sampling
  # rate. Run them head to head with:
  #     python -m scripts.spike.cli bake-off --backends dlib dinov2
  #
  # No weights are downloaded automatically. Fetch each file yourself, read its
  # licence, record it in docs/decisions/0002-..., then fill in the path.
  backends:
    dlib:
      # A real face recognition model. TWO variants exist and they are not
      # interchangeable. Pick one for `recognition_model` and set `dim` to
      # match, or the embedder will refuse.
      #
      #  (a) dlib_face_recognition_resnet_model_v1  -- 128-d, 99.38% LFW.
      #      Covered by the dlib-models public-domain statement, which is
      #      scoped to "trained models created by me (Davis King)".
      #      Residual risk: part of the training data (FaceScrub) is
      #      non-commercial. ADR 0002 treats that as a counsel question.
      #        http://dlib.net/files/dlib_face_recognition_resnet_model_v1.dat.bz2
      #
      #  (b) face_recognition_densenet_model_v1     -- 96.1% LFW.
      #      A BAREL project contribution, so the public-domain statement
      #      above does NOT reach it. BAREL licenses it MIT -- an explicit
      #      grant from the actual author, which is cleaner -- but its
      #      recognition training set is undocumented, and it is less
      #      accurate. Check its real output size before setting dim.
      #        http://dlib.net/files/face_recognition_densenet_model_v1.dat.bz2
      #
      # Both need the landmark predictor:
      #        http://dlib.net/files/shape_predictor_5_face_landmarks.dat.bz2
      dim: 128
      recognition_model: null       # written by `fetch-models --write-config`
      shape_predictor: null
      jitter: 1
      # Recorded 2026-09-23 on the owner's authorisation, for EVALUATION.
      # Verbatim from https://github.com/davisking/dlib-models:
      #   "This repository contains trained models created by me (Davis King).
      #    ... As far as I am concerned, anyone can do whatever they want with
      #    these model files as I've released them into the public domain."
      # Caveat carried from ADR 0002: part of the training data (FaceScrub) is
      # non-commercial, and the statement covers the model file rather than the
      # photographs behind it. Grey area. Low stakes for a measurement; a real
      # decision if this becomes the production scorer, at which point the
      # MIT-licensed DenseNet variant is the cleaner alternative.
      licence: "Public domain (author statement); training-data caveat, see ADR 0002"
      licence_verified_on: 2026-09-23

    dlib-densenet:
      # The cleaner-licensed dlib alternative, measured against the ResNet
      # because the ResNet's public-domain statement carries the FaceScrub
      # training-data caveat (ADR 0002) and this one does not.
      #
      # MIT, from the BAREL project, which is the model's actual author — an
      # explicit grant rather than a blanket line that does not reach it.
      # Weaker on paper: 96.1% LFW against the ResNet's 99.38%.
      #
      # dim is a GUESS. The embedder checks the descriptor it gets back and
      # refuses on a mismatch, naming the real size, so a wrong value here
      # fails loudly rather than producing nonsense.
      dim: 128
      # Committed, not fetched. This model is NOT on dlib.net — its URL was
      # inferred from the ResNet's filename pattern, 404'd in CI, and the
      # failure was invisible because fetch-models reported it on stderr.
      # BAREL hosts it on its own repository; the file here came from there.
      # MIT permits redistribution, with attribution recorded below.
      recognition_model: spike/models/face_recognition_densenet_model_v1.dat
      shape_predictor: null
      jitter: 1
      licence: "MIT (BAREL project, https://github.com/Cydral/BAREL)"
      licence_verified_on: 2026-09-23

    dinov2:
      # A general visual embedder on a cropped face. Apache 2.0.
      # NOT a face recogniser, deliberately: face models are trained to be
      # invariant to pose, light, expression, age and hairstyle, which is the
      # drift we need to catch. Note DINOv3 is NOT Apache 2.0 -- it ships under
      # a bespoke licence. Do not swap it in without reading that.
      dim: 768
      hf_model: facebook/dinov2-base
      crop_margin: 0.25
      detector: yunet               # yunet | dlib-hog
      # YuNet ONNX, Apache 2.0, from the OpenCV Zoo. Not bundled with the pip
      # package. Detection is a separate licence question from recognition.
      detector_model: null            # <- set once you know where this runs
      licence: Apache-2.0
      licence_verified_on: 2026-09-22  # owner read the licence text and confirmed

# --- Providers -------------------------------------------------------------
# `backend: null` means "not implemented yet" and raises a clear error if used.
# The `fake` backends are offline stubs for validating the harness itself.
# Runs containing fake data cannot produce a Gate A report without --allow-fake.
providers:
  image:
    fake:
      backend: fake
      model: fake-image-v0
      price_usd_per_image: 0.0
      verified_on: 1970-01-01
    primary:
      backend: null
      model: null
      endpoint: null
      price_usd_per_image: null
      verified_on: null

  video:
    fake:
      backend: fake
      model: fake-video-v0
      price_usd_per_second: 0.0
      verified_on: 1970-01-01
    fast:                # DEFAULT. Fast tier, single keyframe
      # Chosen over the flagship tier on 2026-09-24. In a controlled
      # comparison -- same shot, same two stills, same seed, same duration,
      # resolution and audio setting, tier the only variable -- the owner
      # rejected the flagship take and kept the Fast one. The 4x rate gap
      # bought nothing visible. n=1 per tier and Veo is stochastic, so this is
      # a default and not a proven ranking; revisit if quality problems
      # appear. Full reasoning in docs/decisions/0007-*.
      backend: fal
      model: fal-ai/veo3.1/fast/image-to-video
      endpoint: null     # the adapter builds it from the model id (ADR 0006)
      # $0.10/s audio off, $0.15/s with, from fal's model listing queried
      # 2026-09-24. Higher figure recorded, as everywhere else here.
      price_usd_per_second: 0.15
      verified_on: 2026-09-24
    fast_audio:          # Fast tier with Veo's native audio ON
      # S0.8's premise is that lip sync is a separate stage with its own
      # provider and its own identity cost. Veo generates audio natively, and
      # if that is usable the stage may not be needed at all -- which would
      # remove a provider, a cost line and a measured identity penalty.
      # Everything generated up to 2026-09-24 has been silent.
      #
      # Same model as the `fast` slot; audio is a per-call argument, not a
      # different endpoint. The guard price already carried the audio-ON
      # figure, so enabling it costs nothing extra against the cap.
      backend: fal
      model: fal-ai/veo3.1/fast/image-to-video
      endpoint: null
      price_usd_per_second: 0.15
      verified_on: 2026-09-24
      options:
        generate_audio: true
    flagship:            # kept for comparison only; see the `fast` slot
      backend: fal
      model: fal-ai/veo3.1/image-to-video
      endpoint: null     # the adapter builds it from the model id (ADR 0006)
      # $0.40/s, from fal's own pricing API (api.fal.ai/v1/models/pricing),
      # queried 2026-09-23. The model's marketing page says $0.20/s with audio
      # off and $0.40/s with; the API reports 0.4 flat as the unit price.
      #
      # The guard takes the HIGHER figure deliberately. A cost guard that
      # understates is worse than none: it lets a run sail past the cap while
      # reporting it is inside it. If audio-off really does halve the rate we
      # over-reserve and spend less than budgeted, which is the safe direction
      # to be wrong in. Revisit once a real invoice can be compared (ADR 0006).
      price_usd_per_second: 0.40
      verified_on: 2026-09-23
    flf_fast:            # first/last-frame conditioning, Fast tier
      # Pins BOTH ends of the motion. The one reproducible Veo failure measured
      # so far is a face that leaves frame and returns: nothing carries the
      # head's state across the occlusion, so the return is reconstructed
      # rather than continued (docs/reports/occlusion-return-failure-2026-09-24.md).
      # Giving the model the last frame removes the thing it was getting wrong.
      #
      # Schema verified against fal's OpenAPI 2026-09-24: prompt,
      # first_frame_url and last_frame_url are required; every other field
      # matches the image-to-video slot. See docs/decisions/0007-*.
      backend: fal
      model: fal-ai/veo3.1/fast/first-last-frame-to-video
      endpoint: null     # the adapter builds it from the model id (ADR 0006)
      # $0.10/s audio off, $0.15/s with, from fal's model listing queried
      # 2026-09-24. The HIGHER figure is recorded, for the same reason as the
      # flagship slot: a guard that understates lets a run sail past the cap
      # while reporting it is inside it.
      price_usd_per_second: 0.15
      verified_on: 2026-09-24
    flf_flagship:        # first/last-frame conditioning, full tier
      # Exists to answer one question: does the Fast tier give up anything
      # that matters? The rate gap is 4x at the guard figures, so it decides
      # the cost model for the whole project (BUILD_PLAN Section 9). Held
      # identical to flf_fast in every other respect so the tier is the only
      # variable.
      backend: fal
      model: fal-ai/veo3.1/first-last-frame-to-video
      endpoint: null     # the adapter builds it from the model id (ADR 0006)
      # $0.20/s audio off, $0.40/s with, from fal's model listing queried
      # 2026-09-24. Higher figure recorded, as everywhere else here.
      price_usd_per_second: 0.40
      verified_on: 2026-09-24
    budget:              # volume / B-roll
      backend: null
      model: null
      endpoint: null
      price_usd_per_second: null
      verified_on: null

  lipsync:
    fake:
      backend: fake
      model: fake-lipsync-v0
      price_usd_per_second: 0.0
      verified_on: 1970-01-01
    primary:
      # S0.8's provider. Takes a video plus EITHER an audio track or text to
      # speak, so one call covers text-to-speech and the sync together.
      # Schema verified against fal's OpenAPI 2026-09-24: video_url required,
      # audio_url / text / voice_id optional.
      backend: fal
      model: fal-ai/pixverse/lipsync
      endpoint: null
      # $0.04 per second of OUTPUT video, from fal's model listing queried
      # 2026-09-24. The listing also notes a surcharge per 100 characters when
      # text is supplied instead of audio; that figure was truncated in the
      # listing and is NOT verified, so the guard below covers video only and
      # will understate a text-driven call. Read it before relying on it.
      price_usd_per_second: 0.04
      verified_on: 2026-09-24
      options:
        text: "The wind is straight into us here, so I am taking one more club."

  # Speech (S0.8). Billed per 1000 characters, not per second of output.
  tts:
    fake:
      backend: fake
      model: fake-tts-v0
      price_usd_per_1000_characters: 0.0
      verified_on: 1970-01-01
    primary:
      # The owner picked the voice on 2026-09-24 -- a D1 decision (BUILD_PLAN
      # Section 1), after rejecting pixverse's built-in voices as "older than
      # her and harsh ... too robotic".
      #
      # Splitting speech from sync is the point: the voice then belongs to a
      # provider good at voices and, unlike Veo's native audio, stays the same
      # across every video. A recurring personality whose voice drifts between
      # clips is as broken as one whose face does.
      backend: fal
      model: fal-ai/elevenlabs/tts/turbo-v2.5
      endpoint: null
      # $0.05 per 1000 characters, from fal's own pricing API
      # (api.fal.ai/v1/models/pricing?endpoint_id=...), queried 2026-09-24.
      price_usd_per_1000_characters: 0.05
      verified_on: 2026-09-24
      options:
        voice: qZNXGnBF6neuAzxagOkO
        # 0.7-1.2. Owner's choice 2026-09-24: 0.85, "slower and a bit more
        # relaxed". The line runs 3.58s at this speed, inside a 4s clip.
        #
        # Not a fitting workaround: the earlier guess that the glitch on "one
        # more club" was the line overrunning its clip was WRONG. At speed 1.0
        # the track was 3.16s in a 4s video, so it always fitted.
        speed: 0.85

# --- LoRA (S0.4) -----------------------------------------------------------
lora:
  base_model: null
  base_model_licence: null          # must permit commercial use
  base_model_licence_verified_on: null
  max_training_runs: 3

# --- Generation defaults ---------------------------------------------------
generation:
  clip_duration_s: 4        # veo3.1 accepts 4s, 6s or 8s only (ADR 0006)
  identity_matrix_cells: 24         # >= 20 required by BUILD_PLAN task 1.6
  takes_per_battery_prompt: 2
  seed: 20260922

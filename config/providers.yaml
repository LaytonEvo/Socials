# Production provider configuration.
#
# Rules from CLAUDE.md that this file exists to enforce:
#   - No model names, endpoints or prices in code. They live here.
#   - Every price carries a `verified_on` date. The cost guard REFUSES a price
#     without one, or one older than `price_max_age_days`.
#   - Model weights carry a licence and the date the licence TEXT was read.
#     Commercial use must be permitted.
#
# Relationship to `config/spike.yaml`: that file configures Spike 0's throwaway
# harness and is frozen when Spike 0 closes. This file configures `app/`. Prices
# below were carried across from spike measurements with their original
# `verified_on` dates intact, which means most of them are ALREADY older than a
# newly verified figure would be. CLAUDE.md requires re-verification against the
# provider's current official docs at the time each adapter is implemented, and
# recording what was found in `docs/decisions/`. Carrying a date forward is not
# verification; it is a record of when someone last looked.
#
# `backend: null` means "not implemented" and must raise a clear error if used,
# never fall back to a default.

price_max_age_days: 90

# Every price here is the HIGHER of the figures a provider publishes where they
# differ (for example audio-on vs audio-off rates). A cost guard that
# understates is worse than no guard: it lets a run sail past the cap while
# reporting it is inside it. Over-reserving spends less than budgeted, which is
# the safe direction to be wrong in.
price_convention: higher_of_published_figures

# --- Secrets ---------------------------------------------------------------
# Names only. Values come from the environment and nowhere else; every name
# here must appear in `.env.example`.
credentials:
  fal: FAL_KEY
  anthropic: ANTHROPIC_API_KEY

# --- Providers -------------------------------------------------------------
providers:

  # Task 0.6 requires the pipeline to run end to end on fakes before any paid
  # call exists. These slots are the only ones Phase 0 needs working.
  fake:
    image:
      backend: fake
      model: fake-image-v0
      price_usd_per_image: 0.0
      verified_on: 1970-01-01
    video:
      backend: fake
      model: fake-video-v0
      price_usd_per_second: 0.0
      verified_on: 1970-01-01
      capabilities:
        durations_s: [4, 5, 6, 8]
        aspects: ["9:16", "16:9", "1:1"]
        image_to_video: true
        native_audio: false
        seed: true
    lipsync:
      backend: fake
      model: fake-lipsync-v0
      price_usd_per_second: 0.0
      verified_on: 1970-01-01
    voice:
      backend: fake
      model: fake-tts-v0
      price_usd_per_1000_characters: 0.0
      verified_on: 1970-01-01
    llm:
      backend: fake
      model: fake-llm-v0
      price_usd_per_1000_input_tokens: 0.0
      price_usd_per_1000_output_tokens: 0.0
      verified_on: 1970-01-01

  # --- Video ---------------------------------------------------------------
  # BUILD_PLAN Section 5 says to implement "one flagship, one budget". Spike 0
  # measured that split backwards. `h3-max-turbo` is both the CHEAPEST video
  # model tested and the only one that renders club-and-ball golf content at
  # all, at 1/12 the rate of the veo3.1 Fast tier that could not. So the two
  # adapters to write first are turbo (golf mechanics, and cheapest) and
  # veo3.1 Fast (verified face-forward quality, and a seed that is at least
  # accepted). Neither is a "flagship" in the price sense.
  #
  # NOT YET AN ADR. The production video provider is chosen on Phase 2's
  # confirmation run against the real persona look, not on Spike 0's throwaway
  # (BUILD_ORDER §2). Both slots stay configured until then.
  video:
    golf:
      # Renders address over a teed ball, a putting stroke and a follow-through
      # on prompts and portrait keyframes where veo3.1 produced neither club
      # nor ball. 64% of club-and-ball takes usable, 83% face-forward, rated
      # blind by the owner. See docs/reports/s07-turbo-format-catalogue-2026-09-28.md.
      backend: fal
      model: minimax/h3-max-turbo/image-to-video
      endpoint: null          # the adapter builds it from the model id (ADR 0006)
      price_usd_per_second: 0.0125
      verified_on: 2026-09-25
      capabilities:
        durations_s: [5]       # integer, minimum 5; a 4 s request is rejected
        aspects: ["9:16"]
        image_to_video: true
        native_audio: forced   # generates a soundtrack unconditionally, no flag
        seed: accepted_not_honoured
      request:
        # Every field name below is a property of the MODEL, which is why it
        # lives beside the model id and not in the adapter. Sending the wrong
        # name is a 422.
        duration_s: 5
        duration_style: seconds_int
        audio_field: target_audio_url
        # The keyframe field. Verified by use rather than by documentation: the
        # spike generated 61 clips on this model through `image_url`. It was
        # never written down here because the spike harness carried a veo3.1
        # default that happened to match — a model's schema belongs beside its
        # model id, not in an adapter's fallback.
        image_field: image_url
        base:
          resolution: 768P
          enable_safety_checker: true
          # NEVER `balanced` or `auto`. Both rewrite the prompt before
          # generation, so the clip on record is not the clip that was asked
          # for. Set to `balanced` between 2026-09-25 and 2026-09-28; every
          # clip generated in that window ran an expanded prompt.
          prompt_expansion_mode: disabled
    face:
      # Kept for face-forward work, where its quality is verified and its
      # native audio can be switched off. 4× the turbo rate and it renders no
      # club (docs/reports/s07-cross-model-probe-2026-09-25.md).
      backend: fal
      model: fal-ai/veo3.1/fast/image-to-video
      endpoint: null
      price_usd_per_second: 0.15
      verified_on: 2026-09-24
      capabilities:
        durations_s: [4, 6, 8]   # literals only (ADR 0006)
        aspects: ["9:16", "16:9"]
        image_to_video: true
        native_audio: optional
        seed: accepted_not_honoured
      request:
        duration_style: veo_literal
        base:
          generate_audio: false
          resolution: 720p
          auto_fix: false        # rewrites the prompt; see the turbo slot

  # --- Image (keyframes) ---------------------------------------------------
  image:
    keyframe:
      # Editing a master still rather than generating a new one, so the face
      # the threshold was calibrated against survives by construction instead
      # of by luck. Wardrobe is set HERE and not in the video prompt: a
      # clothing change in a prompt forces a hard cut and a re-rendered person
      # (docs/reports/wardrobe-control-2026-09-28.md).
      backend: fal
      model: fal-ai/nano-banana-2/edit
      endpoint: null
      price_usd_per_image: 0.08
      verified_on: 2026-09-28
      request:
        image_field: image_urls
        image_field_is_list: true
        base:
          output_format: png
          num_images: 1
          # 1K, not 2K. A keyframe must survive being inlined into the next
          # request, and 2K PNGs came back at 5.6 MB against a 4 MB data-URI
          # cap. An output that cannot be used as input is not an output.
          resolution: 1K
          enable_web_search: false

    lora_inference:
      # Text-to-image with a trained LoRA applied — how a LoRA is evaluated and,
      # later, how keyframes it anchors are generated. Distinct from `keyframe`
      # above, which EDITS an existing still and needs no LoRA at all.
      #
      # ADR 0010 binds this: the FLUX.1 [dev] licence is non-commercial and a
      # derived LoRA inherits that. fal extends its own commercial licence to
      # work trained AND run on their platform, so this endpoint is not a
      # preference — it is where the weights are allowed to run.
      backend: fal
      model: fal-ai/flux-lora
      endpoint: null
      # $0.035 per megapixel, "billed by rounding up to the nearest megapixel"
      # (fal.ai/models/fal-ai/flux-lora, read 2026-09-30). A 1024x1024 image is
      # 1.05 MP, so it rounds to 2 MP and bills 0.07. Priced per IMAGE at that
      # figure rather than per megapixel because the guard prices one unit per
      # slot, and the higher reading is the safe one: a guard that understates
      # lets a run pass the cap while reporting it is inside it.
      price_usd_per_image: 0.07
      verified_on: 2026-09-30
      request:
        base:
          image_size: square_hd
          num_images: 1
          output_format: png
          num_inference_steps: 28
      # How strongly the LoRA is applied, 0-2. Measured 2026-09-30 on the v1
      # artefact, against a centroid built from the holdout only. The ceiling a
      # perfect likeness reaches on this split is 0.98431.
      #
      #                     scale 1.0              scale 1.3
      #   portraits    0.97212 mean          0.97948 mean, 4/4 pass
      #   golf course  0.95905 mean, 1/3     0.97344 mean, 2/3 pass
      #
      # 1.0 failed golf prompts three times in four and produced a visibly
      # different woman. 1.3 fixes most of that and improves portraits too, so
      # it is not a trade. Not pushed higher without evidence: over-weighting a
      # LoRA burns the likeness into every output and costs prompt control.
      options:
        lora_scale: 1.3
        lora_scale_verified_on: 2026-09-30

  # --- Lip sync ------------------------------------------------------------
  lipsync:
    primary:
      # Chosen 2026-09-24 on a controlled three-way: one source clip, one
      # synthesis, three models, nothing else varying. Best on the owner's eye
      # and the only one that did not cost identity (+0.0041 against -0.0037
      # and -0.0006). Amendment A5 requires the render to be re-scored AFTER
      # this stage: the number on a `generation` row predates the last
      # transformation of the face.
      backend: fal
      model: fal-ai/heygen/v3/lipsync/precision
      endpoint: null
      price_usd_per_second: 0.10
      verified_on: 2026-09-24
      request:
        base:
          # "Allow duration adjustment to match the new audio." Required, because
          # without it the model rejects a speech/video duration mismatch outright
          # where other models silently trim — and our lines are shorter than our
          # clips almost every time.
          #
          # The consequence is deliberate and worth stating: a synced take comes back
          # at the LENGTH OF ITS LINE, not the length of the source clip. The edit
          # list is therefore built AFTER the sync, never before.
          #
          # THE SOURCE TAKE MUST ALREADY CONTAIN SPEECH. This model replaces speech;
          # it does not animate a still mouth. A take generated with "mouth closed"
          # is refused outright:
          #
          #     No speech detected in the input video, please try a different video
          #
          # So the shot prompt has to make her talk, and the sync then swaps which
          # words the mouth is forming. Tested 2026-09-30 and it cost nothing — the
          # refusal is a 422 before any GPU runs. Worth knowing before anyone
          # "improves" a shot prompt by quietening her down.
          enable_dynamic_duration: true
      # Schema read from the endpoint's own OpenAPI on 2026-09-30. `end_time` was
      # previously set to the string "auto" here, which is not a value it accepts —
      # it takes a number of seconds for a PARTIAL sync, or nothing at all. It was
      # never exercised, so the error sat in config until the first real call
      # returned 422. Validation rejections are free; this one cost nothing but the
      # time to read the schema properly.

    alternative:
      # Second opinion on sync QUALITY. heygen was chosen on 2026-09-24 for its
      # identity delta (+0.0041, the only one that did not cost identity) on a
      # three-way against pixverse and veed — but identity is not the same
      # question as whether the mouth matches the words, and the owner reports
      # it still does not.
      #
      # This model is the one with an explicit story about the case that keeps
      # biting: `sync_mode` says what to do when the audio and video durations
      # disagree, where heygen simply refuses. cut_off | loop | bounce |
      # silence | remap.
      backend: fal
      model: fal-ai/sync-lipsync/v2
      endpoint: null
      # "$3 per minute of video", "$5/minute" for lipsync-2-pro, read from the
      # model page 2026-09-30. Per SECOND here because that is the unit the
      # guard bills in: 5/60 = 0.083333, rounded up, pro tier.
      price_usd_per_second: 0.0834
      verified_on: 2026-09-30
      request:
        base:
          model: lipsync-2-pro
          # Our lines are shorter than our shots almost every time. `silence`
          # pads rather than looping her back to the start of the sentence or
          # bouncing it backwards, both of which would be worse than the
          # padding we already do by hand for heygen.
          sync_mode: silence

  # --- Sound effects and ambience ------------------------------------------
  sfx:
    primary:
      # Generates audio ALIGNED TO THE PICTURE from a text prompt, which is the
      # thing a stock library cannot do: a struck ball has to sound at the frame
      # the club reaches it.
      #
      # This exists because dropping the video model's invented soundtrack left
      # b-roll in total silence — honest, and wrong. A golf shot with no contact
      # sound reads as broken.
      backend: fal
      model: fal-ai/mmaudio-v2
      endpoint: null
      # "$0.001 per second", read from the model page 2026-09-30. The cheapest
      # thing in the chain by two orders of magnitude.
      price_usd_per_second: 0.001
      verified_on: 2026-09-30
      request:
        base:
          num_steps: 25
          cfg_strength: 4.5

  # --- Voice ---------------------------------------------------------------
  voice:
    primary:
      # A designed synthetic voice, per task 3.6 — not cloned from a real
      # person. Splitting speech from sync is the point: the voice belongs to a
      # provider good at voices and stays the same across every video, where a
      # video model's native audio drifts between takes. A recurring
      # personality whose voice drifts is as broken as one whose face does.
      #
      # Billed per 1000 characters, not per second of output.
      backend: fal
      model: fal-ai/elevenlabs/tts/turbo-v2.5
      endpoint: null
      price_usd_per_1000_characters: 0.05
      verified_on: 2026-09-24
      # Voice id, speed and delivery are owner choices (D1), settled by ear on
      # 2026-09-24. They live in `config/persona.yaml`, not here: they are
      # persona identity, not provider configuration.
      #
      # OPEN: this voice's provenance has not been checked. Task 3.6 requires a
      # DESIGNED voice; if this id is a library voice cloned from a real
      # person, it does not satisfy that and must be replaced. Verify before a
      # published render.
      provenance_verified_on: null
      request:
        # Field names are the MODEL's schema, so they live beside the model id.
        # Confirmed against the spike's own TTS adapter, which ran 16 calls
        # through this shape on 2026-09-24.
        text_field: text
        voice_field: voice

  # --- LLM (shot lists, captions) ------------------------------------------
  llm:
    shotlist:
      # Task 3.1: brief in, schema-validated JSON shot list out. This is the
      # ONLY place Claude appears inside the running product, and it is called
      # through `app/providers/` like any other adapter.
      backend: anthropic
      model: claude-opus-5
      endpoint: null
      # NOT VERIFIED. Deliberately null rather than filled from memory: the
      # cost guard refuses a price without a `verified_on`, which is the
      # correct behaviour here. Read Anthropic's current pricing page when the
      # adapter is written and record it in docs/decisions/.
      price_usd_per_1000_input_tokens: null
      price_usd_per_1000_output_tokens: null
      verified_on: null
      request:
        # A locked prompt prefix makes caching possible, but a prefix shorter
        # than the model's minimum cacheable length silently does not cache.
        # Verify with `usage.cache_read_input_tokens` rather than assuming.
        prompt_caching: true

# --- Identity scorer -------------------------------------------------------
# Not a "provider" in the adapter sense, but it carries the same licence and
# verification obligations, and amendment A3 makes its version part of the
# data model: a calibrated threshold is valid for ONE model at ONE version.
# Changing either invalidates every stored vector and the threshold with them,
# so the schema records the model and version on every row that holds one and
# re-calibration is forced when they change.
embedder:
  backend: dlib                     # ADR 0004, on measured separation
  model: dlib_face_recognition_resnet_model_v1
  # The SHA-256 of the weights file, which is the only version identifier dlib's
  # models actually have — they carry no semantic version, and "v1" is part of the
  # filename rather than a release. Amendment A3 requires the version pinned before
  # any vector is stored, because a threshold is valid for one model at one version;
  # a hash is the strongest form of that, since it changes if a single byte does.
  # 64 hex characters, which is exactly what `embedding_model_version` holds.
  version: 55533b28a95800a551ba546ba62fe69625c7e95a7061c338adffead08719da30
  dim: 128
  frame_sample_fps: 2.0
  # Weights are not committed (2.5 MB and 9 MB), and these paths are where
  # `fetch-models` puts them. The loader refuses to score if either is missing
  # rather than silently falling back to a different model.
  recognition_model: spike/models/dlib_face_recognition_resnet_model_v1.dat
  shape_predictor: spike/models/shape_predictor_5_face_landmarks.dat
  shape_predictor_sha256: c4b1e9804792707d3a405c2c16a80a20269e6675021f64a41d30fffafbc41888
  threshold: null                   # written by calibration; never hand-edited
  threshold_calibrated_on: null
  # Public domain by the author's statement, with a training-data caveat:
  # part of FaceScrub is non-commercial, and the statement covers the model
  # file rather than the photographs behind it. ADR 0004 treats this as a
  # counsel question. It blocks PUBLICATION, not measurement.
  licence: "Public domain (author statement); FaceScrub training-data caveat, see ADR 0004"
  licence_verified_on: 2026-09-23
  licence_cleared_for_publication: false

# --- LoRA ------------------------------------------------------------------
lora:
  # ADR 0010. FLUX.1 [dev] via fal's hosted trainer. ADR 0005 chose schnell to avoid
  # dev's non-commercial licence; fal has no schnell trainer, so that route does not
  # exist and this is the one that does.
  base_model: FLUX.1-dev
  trainer: fal-ai/flux-lora-portrait-trainer
  price_usd_per_step: 0.024
  price_verified_on: 2026-09-29
  # Commercial use is fal's, not ours. fal pays Black Forest Labs for a commercial
  # licence and extends it to work trained and run on their platform.
  base_model_licence: "FLUX.1 [dev] Non-Commercial (BFL); commercial use via fal's own licence, while running on fal"
  base_model_licence_verified_on: 2026-09-29
  base_model_licence_verified_by: owner
  # THE CONSTRAINT THAT MATTERS. Downloading the weights and running them on our own
  # FLUX.1 [dev] setup falls back under BFL's non-commercial licence. Inference must
  # go through fal until either fal confirms otherwise in writing or a BFL licence is
  # bought. lora_version.storage_key is a backup and a version record, NOT a
  # deployment artefact.
  inference_must_run_on: fal
  self_hosting_permitted: false
  # Outstanding, and a blocker for scale rather than for training: fal's commercial
  # grant is stated on a model page rather than in the terms. Get it in writing before
  # a large campaign.
  commercial_grant_confirmed_in_writing: false
  max_training_runs: 3

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-studio"
version = "0.0.0"
description = "A recurring, openly-AI golf personality. Production system plus the Spike 0 harness that sized it."
# BUILD_PLAN Section 3 recommends Python 3.12 and mypy targets it below. The
# floor stays at 3.11 so the project still runs on a 3.11 interpreter; the type
# target is what holds the code to 3.12 semantics.
requires-python = ">=3.11"
dependencies = [
  # Shared
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  # Config validation (task 0.2)
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  # Database and migrations (task 0.3). pgvector is required by amendment A3:
  # embeddings are stored as vectors with the model version pinned beside them.
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  # Object storage (task 0.4). S3-compatible, so the same client covers
  # Railway's bucket and any other provider.
  "boto3>=1.34",
  # Job queue and worker (task 0.5)
  "arq>=0.26",
  "redis>=5.0",
  # API and server-rendered UI. No SPA, per BUILD_PLAN Section 3.
  "fastapi>=0.111",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.30",
  # Provider calls. ADR 0006 established that fal needs no vendor SDK — the
  # adapter builds its endpoints from the model id — so an HTTP client is
  # enough, and one fewer dependency is one fewer thing to pin.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
# ADR 0002 candidates. Installed only when you run the bake-off; neither is
# needed for `make check` or the offline demo.
dlib = ["dlib>=19.24"]
# torchvision is NOT optional despite not being imported directly: transformers
# 5.x routes AutoImageProcessor through it, so leaving it out installs cleanly
# and then fails at first use with an ImportError about a library you never
# asked for.
dinov2 = [
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
  "opencv-python-headless>=4.9",
]

[tool.setuptools]
packages = [
  "app",
  "app.analytics", "app.api", "app.compliance", "app.config", "app.costs",
  "app.identity",
  "app.models", "app.pipeline", "app.providers", "app.publishing", "app.ui",
  "workers",
  "scripts", "scripts.spike",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# The project's target (BUILD_PLAN Section 3), NOT whatever interpreter happens
# to be installed. This was pinned to 3.11 because a dev container had that, and
# CI on 3.12 then failed inside numpy's own type stubs, which use 3.12 syntax.
# Pin the target; let the interpreter vary.
python_version = "3.12"
files = ["app", "workers", "scripts", "tests"]
mypy_path = "."
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
  "PIL", "PIL.*", "numpy", "numpy.*", "yaml", "yaml.*", "pytest", "_pytest.*",
  "cv2", "cv2.*", "dlib", "torch", "torch.*", "transformers", "transformers.*",
  "boto3", "boto3.*", "botocore", "botocore.*", "pgvector", "pgvector.*",
]
ignore_missing_imports = true

# The spike's tests are throwaway alongside the spike. They are linted and run,
# but not held to strict typing -- annotating every fixture would cost more than
# it catches here.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: spends real money against a real provider. Never runs by default; needs `-m live` and an explicit `--live-budget`. See tests/conftest.py.",
]

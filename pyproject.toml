[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-studio-spike"
version = "0.0.0"
description = "Spike 0 feasibility harness. Throwaway by design; not the production system."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
# ADR 0002 candidates. Installed only when you run the bake-off; neither is
# needed for `make check` or the offline demo.
dlib = ["dlib>=19.24"]
dinov2 = ["torch>=2.2", "transformers>=4.40", "opencv-python-headless>=4.9"]

[tool.setuptools]
packages = ["scripts", "scripts.spike"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["scripts", "tests"]
mypy_path = "."
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
  "PIL", "PIL.*", "numpy", "numpy.*", "yaml", "yaml.*", "pytest", "_pytest.*",
  "cv2", "cv2.*", "dlib", "torch", "torch.*", "transformers", "transformers.*",
]
ignore_missing_imports = true

# The spike's tests are throwaway alongside the spike. They are linted and run,
# but not held to strict typing -- annotating every fixture would cost more than
# it catches here.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

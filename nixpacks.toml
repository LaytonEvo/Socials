# Explicit build for Railway rather than letting the builder infer one.
#
# The first deploy "succeeded" and then crash-looped on `uvicorn: command not found`:
# the builder recognised a Python project, produced an image, and never installed the
# dependencies. A build that reports success and cannot start is worse than one that
# fails, so nothing here is left to inference.

[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  # Installs the project and its declared dependencies. Not the dlib extra: the
  # read-only view computes no embeddings, and dlib is a source build that would add
  # minutes to every deploy for nothing.
  ". /opt/venv/bin/activate && pip install .",
]

[start]
# `python -m uvicorn` rather than the bare command, so it resolves through the
# interpreter that actually holds the package rather than through PATH.
cmd = ". /opt/venv/bin/activate && python -m uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
